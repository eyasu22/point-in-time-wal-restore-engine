version = "1.0"

[metadata]
name = "point-in-time-wal-restore-engine"
title = "Point-in-Time WAL Restore Engine"
description = "Build a crash-safe key-value store with an append-only WAL, atomic checkpoints, monotonic LSNs, concurrent writers, and point-in-time restore that replays history without losing or duplicating committed mutations."
author_name = "odyssey"
difficulty = "hard"
category = "software_engineering"
tags = [
  "python",
  "fastapi",
  "sqlite",
  "wal",
  "checkpoint",
  "pitr",
  "systems_integration",
]

[agent]
timeout_sec = 7200.0
network_mode = "none"

[verifier]
timeout_sec = 600.0
network_mode = "none"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 5120
gpus = 0
network_mode = "none"
